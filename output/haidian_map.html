<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>海淀校区地图</title>
<style>
:root{
  color-scheme: light;
  --map-bg:#edf1ed; --canvas:#efeff2;
  --text-strong:#1c1c1e; --text:#2c2c2e; --muted:#545458; --subtle:#6e6e73;
  --border-subtle:#e5e5ea; --border:#d1d1d6;
  --sel:#e8e8eb; --sel-hover:#dfdfe3; --sel-pressed:#d4d4da; --sel-border:#6f6f76;
  --ov:#ffffffcc; --ov-strong:#fffffff2; --ov-soft:#ffffff8f; --ov-hover:#ffffffd1;
  --ov-border:#ffffffb3; --ov-border-strong:#26262742; --ov-divider:#fff9;
  --shadow-xs:0 1px 2px 0 #0000000d; --shadow-sm:0 8px 20px #1c1c1e1a;
  --focus:#5e5e65; --ease:cubic-bezier(.2,0,0,1); --fast:.15s;
  --font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.root{position:relative;height:100vh;height:100dvh;overflow:hidden;background:var(--map-bg)}
.canvas{position:absolute;inset:0;touch-action:none}
.canvas.dragging{cursor:grabbing}
.canvas>svg{display:block;width:100%;height:100%}
.canvas .pick{cursor:pointer}
.lbl{pointer-events:none;fill:#1c1c1e;paint-order:stroke;stroke:var(--map-bg);stroke-linejoin:round;font-family:var(--font)}
#markers{position:absolute;inset:0;pointer-events:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.marker{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;padding:0;border:2px solid #fff;border-radius:999px;display:grid;place-items:center;background:#262627;color:#fff;box-shadow:var(--shadow-sm);pointer-events:auto;transition:box-shadow var(--fast) var(--ease),transform var(--fast) var(--ease)}
.marker>span{width:8px;height:8px;border-radius:999px;background:currentColor}
.marker[data-variant=dining]{background:#00703e}
.marker[data-variant=gate]{background:#2c2c2e}
.marker[data-variant=landmark]{background:#eeb736;color:#1c1c1e}
.marker[data-variant=transport]{background:#48484a}
.marker:hover:not([data-selected=true]){box-shadow:0 0 0 2px #fff,0 0 0 5px var(--sel-border),var(--shadow-sm);transform:scale(1.08)}
.marker[data-selected=true]{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--sel-border),var(--shadow-sm);transform:scale(1.16);z-index:1}
.marker:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.marker.dot{width:12px;height:12px;margin:-6px 0 0 -6px;border-width:2px;background:#30404d;box-shadow:0 1px 2px #0000002e}
.marker.dot>span{display:none}
.marker.dot::before{content:"";position:absolute;inset:-10px;border-radius:999px}
.marker.dot:hover:not([data-selected=true]){box-shadow:0 0 0 2px #fff,0 0 0 4px var(--sel-border);transform:scale(1.2)}
.marker.dot[data-selected=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--sel-border);transform:scale(1.3)}
.mlabel{position:absolute;left:0;top:0;transform:translate(10px,-50%);white-space:nowrap;pointer-events:none;font-size:12px;font-weight:500;color:#1c1c1e;text-shadow:0 0 2px var(--map-bg),0 0 2px var(--map-bg),0 0 3px var(--map-bg)}

.panel{position:absolute;z-index:20;left:12px;top:12px;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;border:2px solid var(--ov-border-strong);border-radius:16px;background:var(--ov-strong);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);overflow:hidden;max-height:min(34dvh,220px);transition:max-height .22s var(--ease)}
.panel.expanded{max-height:min(58dvh,430px)}
.head{padding:10px;display:flex;flex-direction:column;gap:8px}
.panel.expanded .head{border-bottom:1px solid var(--border-subtle)}
.row{display:flex;align-items:center;gap:8px}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center;margin:0}
.search>svg{position:absolute;left:12px;color:var(--subtle);pointer-events:none}
.search input{width:100%;min-height:40px;border:2px solid var(--ov-border-strong);border-radius:999px;background:var(--ov-strong);box-shadow:var(--shadow-xs);padding:0 12px 0 36px;font-size:14px;font-weight:500;color:var(--text-strong);outline:none}
.search input::placeholder{color:var(--subtle);font-weight:400}
.search input:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.search input.has{padding-right:40px}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);transition:background-color var(--fast) var(--ease)}
.iconbtn:hover{background:var(--sel-hover);color:var(--text-strong)}
.iconbtn:active{background:var(--sel-pressed)}
.clear{position:absolute;right:2px;top:50%;transform:translateY(-50%)}
.toggle{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border:1px solid var(--ov-border);border-radius:999px;font-size:12px;font-weight:600;box-shadow:var(--shadow-xs);background:var(--sel);color:var(--text-strong);transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.toggle:hover{background:var(--sel-hover)}
.toggle:active{background:var(--sel-pressed)}
.panel.expanded .toggle{background:var(--ov-soft);color:var(--muted)}
.panel.expanded .toggle:hover{background:var(--ov-hover);color:var(--text)}
.notice{margin:0;padding:8px 12px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--ov-soft);font-size:12px;line-height:20px;color:var(--muted)}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500;color:var(--muted);transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.chip:hover{background:var(--ov-hover);color:var(--text)}
.chip:active{background:var(--sel-pressed)}
.chip[aria-pressed=true]{background:var(--sel);color:var(--text-strong)}
.results{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.meta{font-size:12px;line-height:18px;color:var(--subtle)}
.results>h2{margin:0;padding:4px 8px;font-size:12px;font-weight:600;color:var(--subtle)}
.group{border:0;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:4px}
.group>legend{padding:0 8px;font-size:12px;line-height:18px;font-weight:600;color:var(--subtle)}
.item{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:76px;padding:10px;border:1px solid transparent;border-radius:8px;background:var(--ov-soft);text-align:left;transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),transform .08s var(--ease)}
.item:hover{background:var(--ov-hover)}
.item:active{background:var(--sel-pressed);transform:scale(.99)}
.item.active{border-color:var(--border);background:var(--ov)}
.item[aria-pressed=true]{border-color:var(--sel-border);background:var(--sel)}
.item .t{font-size:14px;font-weight:600;color:var(--text-strong);line-height:20px}
.item .m{margin-top:2px}
.item .d{margin-top:4px;font-size:12px;line-height:20px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.more{min-height:40px;border:0;border-radius:8px;padding:0 8px;background:transparent;font-size:14px;font-weight:500;color:var(--muted);text-align:left}
.more:hover{background:var(--ov-hover);color:var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;padding:32px 24px;text-align:center}
.empty h3{margin:0;font-size:14px;font-weight:500;color:var(--text-strong)}
.empty p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.outline-btn{margin-top:16px;min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px;font-weight:500}
.outline-btn:hover{background:var(--sel)}

.controls{position:absolute;z-index:20;right:12px;bottom:48px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.zoom{margin:0;padding:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--ov-border);border-radius:999px;background:var(--ov);box-shadow:var(--shadow-xs);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ctl{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--muted);transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.ctl:hover{background:var(--ov-hover);color:var(--text)}
.ctl:active{background:var(--sel-pressed)}
.ctl svg.i{width:20px;height:20px}
.zoom .ctl+.ctl{border-top:1px solid var(--ov-divider)}
.reset{border:1px solid var(--ov-border);border-radius:999px;background:var(--ov);box-shadow:var(--shadow-xs);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.reset svg.i{width:16px;height:16px}
.scale{position:absolute;z-index:10;left:10px;bottom:10px;height:18px;border:2px solid #333;border-top:0;padding:0 5px;background:#ffffffbf;font-size:10px;line-height:16px;color:#333;pointer-events:none}
.attr{position:absolute;z-index:10;right:0;bottom:0;padding:2px 8px;border-top-left-radius:6px;background:#ffffffbf;font-size:12px;line-height:18px;color:#000000bf}

.detail{position:absolute;z-index:30;left:384px;top:80px;width:340px;border:1px solid var(--ov-border);border-radius:12px;background:var(--ov-strong);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:enter .18s var(--ease)}
.detail[hidden]{display:none}
.grab{display:none}
.dclose{position:absolute;right:12px;top:12px;width:40px;height:40px}
.dbody{display:flex;align-items:flex-start;gap:12px;padding:16px}
.dicon{flex:none;margin-top:2px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sel);color:var(--text-strong)}
.dicon svg.i{width:20px;height:20px}
.dmain{min-width:0;flex:1;padding-right:36px}
.dmain h2{margin:0;font-size:16px;line-height:24px;font-weight:600;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmain .m{margin:4px 0 0;font-size:12px;color:var(--muted)}
.dmain .desc{margin:12px 0 0;font-size:14px;line-height:24px;color:var(--muted)}
.rows{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.rows>div{display:grid;grid-template-columns:72px 1fr;column-gap:12px;align-items:baseline;font-size:14px;line-height:24px}
.rows .k{font-size:12px;color:var(--subtle)}
.rows .v{min-width:0;word-break:break-word;color:var(--muted)}
.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:#f2f2f5;color:var(--muted)}
@keyframes enter{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@media (max-width:959px){
  .panel{left:12px;right:12px;width:auto;max-height:148px}
  .panel.expanded{max-height:42dvh}
  .panel.compact{max-height:none}
  .search input,.toggle{min-height:44px}
  .toggle{font-size:14px}
  .chip{min-height:44px}
  .controls{bottom:112px}
  .root.has-sel .controls{display:none}
  .detail{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:48dvh;overflow-y:auto;border-radius:16px;padding-bottom:env(safe-area-inset-bottom);animation:sheet .22s var(--ease)}
  .grab{display:grid;place-items:center;margin:8px auto 0;width:64px;min-height:20px;border:0;border-radius:999px;background:transparent}
  .grab>span{width:40px;height:4px;border-radius:999px;background:var(--border)}
  .dbody{padding-top:8px}
  .dclose{top:28px}
}
@media (max-width:639px){.reset .lbl-t{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

    <div id="markers"></div>
  </section>

    <div class="head">
      <div class="row">
        <form class="search" role="search" id="searchForm" onsubmit="return false">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="搜索地点" aria-label="搜索地点" aria-controls="results" autocomplete="off">
          <button type="button" class="iconbtn clear" id="qclear" aria-label="清除搜索" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </form>

  <div class="controls" id="controls">

      <button type="button" class="ctl" id="zout" aria-label="缩小地图"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </fieldset>
    <button type="button" class="ctl reset" id="reset" aria-label="回到当前校区"><svg class="i" viewBox="0 0 24 24"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl-t">当前校区</span></button>
  </div>

  <div class="scale" id="scale"></div>
  <div class="attr">© OpenStreetMap contributors</div>

  <section class="detail" id="detail" role="dialog" aria-modal="false" hidden></section>
</div>

const GROUPS=["食堂","教学楼","宿舍","出入口","服务","运动"];
const CATS=[["食堂","dining"],["教学楼","teaching"],["宿舍","dorm"],["出入口","entrance"],["服务","service"],["运动","sport"]];
const HIDE_ROWS=new Set(["名称状态","名称来源","核对说明"]);
const HIDE_TAGS=new Set(["丰台","丰台校区","海淀","海淀校区"]);

const ICON={
  x:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  up:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>'
};

// ---------- 地点数据（与线上 map-page 的分组规则一致） ----------
function groupOf(p){
  const t=p.tags||[];
  if(t.includes("食堂"))return"食堂";
  if(t.includes("宿舍")||t.includes("静园")||t.includes("公寓"))return"宿舍";
  if(t.includes("教学")||t.includes("上课"))return"教学楼";
  if(p.category==="gate"||p.category==="transport")return"出入口";
  if(t.includes("运动"))return"运动";
  return"服务";
}
const collator=new Intl.Collator("zh-Hans-CN",{numeric:true,sensitivity:"base"});
const ITEMS=PLACES.map((p,i)=>{
  const label=groupOf(p);
  return{
    place:p,index:i,label,
    cat:CATS.find(c=>c[0]===label)[1],
    rows:[...(p.accessNote?[{label:"到达提示",value:p.accessNote}]:[]),...(p.additionalProperties||[]).filter(r=>!HIDE_ROWS.has(r.label))],
    tags:[...new Set([label,...(p.tags||[])])].filter(t=>!HIDE_TAGS.has(t)),
    refs:p.mapFeatureRefs||[],
    variant:(p.tags||[]).includes("食堂")?"dining":p.category,
    search:[p.title,p.description,p.campus,...(p.tags||[]),...(p.additionalProperties||[]).flatMap(r=>[r.label,r.value])].join(" ").toLowerCase()
  };
});
const itemById=new Map(ITEMS.map(it=>[it.place.id,it]));
const placeByKey=new Map();for(const it of ITEMS)for(const r of it.refs)placeByKey.set(r.layer+":"+r.fid,it.place.id);

// ---------- 几何 ----------
const P=([lon,lat])=>[(lon-LON0)*KX,-(lat-LAT0)*KY];
const fmt=v=>v.toFixed(2);
const ringD=r=>"M"+r.map(c=>{const[x,y]=P(c);return fmt(x)+" "+fmt(y)}).join("L")+"Z";
const polysOf=g=>g.type==="Polygon"?[g.coordinates]:g.coordinates;
const geomD=g=>polysOf(g).map(p=>p.map(ringD).join("")).join("");
const lineD=g=>(g.type==="LineString"?[g.coordinates]:g.coordinates).map(l=>"M"+l.map(c=>{const[x,y]=P(c);return fmt(x)+" "+fmt(y)}).join("L")).join("");
function area(r){let s=0;for(let i=0;i<r.length-1;i++)s+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];return s/2}
function centroid(g){
  const ring=polysOf(g).reduce((a,p)=>Math.abs(area(p[0]))>Math.abs(area(a))?p[0]:a,polysOf(g)[0][0]).map(P);
  let A=0,cx=0,cy=0;
  for(let i=0;i<ring.length-1;i++){const[x0,y0]=ring[i],[x1,y1]=ring[i+1];const f=x0*y1-x1*y0;A+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f}
  return A?[cx/(3*A),cy/(3*A)]:ring[0];
}
function bboxOf(g){let a=[1e9,1e9,-1e9,-1e9];for(const p of polysOf(g))for(const c of p[0]){const[x,y]=P(c);a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)]}return a}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

// ---------- 绘制底图 ----------
const svg=document.getElementById("svg");
const NSS={"vector-effect":"non-scaling-stroke"};
const L={};
for(const n of["green","road","roadLine","pad","sport","mark","bld","hovFill","hovLine","selFill","selHalo","selLine","bnd","lbl"])L[n]=el("g",{},svg);
for(const n of["mark","hovFill","hovLine","selFill","selHalo","selLine","bnd","lbl","roadLine","pad"])L[n].setAttribute("pointer-events","none");
L.road.setAttribute("pointer-events","none");L.green.setAttribute("pointer-events","none");
L.mark.setAttribute("fill","none");L.mark.setAttribute("stroke","rgba(255,255,255,.85)");
L.hovFill.setAttribute("fill","#e8e8eb");L.hovFill.setAttribute("fill-opacity",".62");
L.hovLine.setAttribute("fill","none");L.hovLine.setAttribute("stroke","#6f6f76");L.hovLine.setAttribute("stroke-opacity",".72");
L.selFill.setAttribute("fill","#e8e8eb");
L.selHalo.setAttribute("fill","none");L.selHalo.setAttribute("stroke","#ffffff");L.selHalo.setAttribute("stroke-opacity",".94");L.selHalo.setAttribute("stroke-linejoin","round");
L.selLine.setAttribute("fill","none");L.selLine.setAttribute("stroke","#6f6f76");L.selLine.setAttribute("stroke-opacity",".98");L.selLine.setAttribute("stroke-linejoin","round");
L.lbl.setAttribute("class","lbl");

const feat=new Map();let boundaryBox=null;const labels=[];
// 与 QGIS 标签表达式一致：研究所名称在“中国社会科学院”后换行
const LABEL_BREAKS=["中国社会科学院"];
function labelLines(name){for(const p of LABEL_BREAKS)if(name.startsWith(p)&&name.length>p.length)return[p,name.slice(p.length)];return[name]}
for(const f of OVERLAY.features){
  if(f.properties.kind==="pad")el("path",{d:geomD(f.geometry),fill:"#e8d3c8",stroke:"#c4a597","stroke-width":1,...NSS,"fill-rule":"evenodd"},L.pad);
  else el("path",{d:lineD(f.geometry),...NSS},L.mark);
}
for(const f of GEO.features){
  const pr=f.properties,g=f.geometry,key=pr.layer+":"+pr.fid,d=geomD(g);
  if(pr.layer==="green")el("path",{d,fill:pr.surface==="lawn"?"#b5dc9c":"#e1f2d6","fill-rule":"evenodd"},L.green);
  else if(pr.layer==="roadp"){el("path",{d,fill:"#d3d8d4","fill-opacity":.96,"fill-rule":"evenodd"},L.road);el("path",{d,fill:"none",stroke:"rgba(117,130,122,.88)","stroke-width":.9,...NSS},L.roadLine)}
  else if(pr.layer==="sport"){const[fc,oc]=SPORT[pr.sport_category]||SPORT["运动场"];el("path",{d,fill:fc,stroke:oc,"stroke-width":1,...NSS,"fill-rule":"evenodd","data-key":key},L.sport);feat.set(key,{f,d})}
  else if(pr.layer==="building"){
    const named=!!pr.name;
    el("path",{d,fill:BFILL[pr.category]||"#a6a09a","fill-opacity":.94,stroke:named?(BLINE[pr.category]||"#736d68"):"#545458","stroke-width":named?1:1.4,"stroke-dasharray":named?"":"4 3",...NSS,"fill-rule":"evenodd","data-key":key},L.bld);
    feat.set(key,{f,d});
    if(named){
      const[cx,cy]=centroid(g),b=bboxOf(g);
      const lines=labelLines(pr.name);
      const t=el("text",{x:fmt(cx),y:fmt(cy),"text-anchor":"middle","dominant-baseline":"central"},L.lbl);
      if(lines.length===1)t.textContent=pr.name;
      else lines.forEach((s,i)=>{const sp=el("tspan",{x:fmt(cx),dy:i===0?`${-(lines.length-1)*0.6}em`:"1.2em"},t);sp.textContent=s});
      labels.push({t,w:b[2]-b[0],h:b[3]-b[1],len:Math.max(...lines.map(s=>s.length)),rows:lines.length,key});
    }
  }
  else if(pr.layer==="boundary"){el("path",{d,fill:"none",stroke:"#262627","stroke-width":2,"stroke-opacity":.92,...NSS},L.bnd);boundaryBox=bboxOf(g)}
}
for(const p of svg.querySelectorAll("[data-key]"))if(placeByKey.has(p.dataset.key)||p.dataset.key.startsWith("building:"))p.classList.add("pick");

// ---------- 视图 ----------
const mapEl=document.getElementById("map"),root=document.getElementById("root");
let V={cx:0,cy:0,upp:1},W=1,H=1,home=null,userMoved=false;
const clampU=u=>Math.min(4,Math.max(.03,u));
const zoomOf=u=>Math.log2(59960/u);                 // 与 MapLibre 缩放级别对应（北纬 39.95°）
const uppOf=z=>59960/2**z;
const lerpZ=(z,a,b,c)=>z<=14?a:z>=20?c:z<=17?a+(b-a)*(z-14)/3:b+(c-b)*(z-17)/3;
function padding(){return DESKTOP.matches?{top:96,bottom:80,left:396,right:96}:{top:172,bottom:64,left:20,right:20}}
function fitBox(b,pad,minU){const w=Math.max(W-pad.left-pad.right,80),h=Math.max(H-pad.top-pad.bottom,80);const u=clampU(Math.max((b[2]-b[0])/w,(b[3]-b[1])/h,minU||0));return{cx:(b[0]+b[2])/2-(pad.left-pad.right)/2*u,cy:(b[1]+b[3])/2-(pad.top-pad.bottom)/2*u,upp:u}}
function measure(){const r=mapEl.getBoundingClientRect();W=Math.max(r.width,100);H=Math.max(r.height,100)}
function computeHome(){home=fitBox(boundaryBox,padding())}
const toScreen=(x,y)=>[(x-V.cx)/V.upp+W/2,(y-V.cy)/V.upp+H/2];

function render(){
  svg.setAttribute("viewBox",[V.cx-W*V.upp/2,V.cy-H*V.upp/2,W*V.upp,H*V.upp].join(" "));
  const u=V.upp,z=zoomOf(u);
  L.lbl.setAttribute("font-size",12*u);L.lbl.setAttribute("stroke-width",2.4*u);
  for(const l of labels){const need=Math.min(l.len,8)*12;l.t.style.display=(l.w/u>=need*.8&&l.h/u>=12*l.rows)||z>=18.2||l.key===selKeyLabel?"":"none"}
  L.mark.setAttribute("stroke-width",Math.max(.18,.6*u));L.mark.style.display=z<15.5?"none":"";
  L.hovLine.setAttribute("stroke-width",lerpZ(z,1.4,2.1,3));
  L.selHalo.setAttribute("stroke-width",lerpZ(z,5.2,7.2,10));
  L.selLine.setAttribute("stroke-width",lerpZ(z,2.4,3.4,4.8));
  for(const m of markerEls){
    const[x,y]=toScreen(m.x,m.y);m.b.style.left=x.toFixed(1)+"px";m.b.style.top=y.toFixed(1)+"px";
    if(m.lb){m.lb.style.left=x.toFixed(1)+"px";m.lb.style.top=y.toFixed(1)+"px";m.lb.hidden=!(z>=17||m.id===selectedId)}
  }
  drawScale();
}
const scaleEl=document.getElementById("scale");
function drawScale(){const m=V.upp*100;const p=10**Math.floor(Math.log10(m));const n=[5,2,1].map(k=>k*p).find(v=>v<=m)||p;scaleEl.style.width=(n/V.upp).toFixed(0)+"px";scaleEl.textContent=n>=1000?n/1000+"km":n+"m"}

let raf=0;
function cancelFly(){if(raf)cancelAnimationFrame(raf);raf=0}
function animateTo(t,dur=420){
  cancelFly();
  if(reduceMotion.matches||dur===0){V={...t};render();return}
  const s={...V},t0=performance.now();
  const step=now=>{let k=Math.min(1,(now-t0)/dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;V.cx=s.cx+(t.cx-s.cx)*k;V.cy=s.cy+(t.cy-s.cy)*k;V.upp=s.upp*Math.pow(t.upp/s.upp,k);render();raf=k<1?requestAnimationFrame(step):0};
  raf=requestAnimationFrame(step);
}
function zoomAt(px,py,f){userMoved=true;cancelFly();const wx=V.cx+(px-W/2)*V.upp,wy=V.cy+(py-H/2)*V.upp;V.upp=clampU(V.upp*f);V.cx=wx-(px-W/2)*V.upp;V.cy=wy-(py-H/2)*V.upp;render()}
function zoomBy(dz){userMoved=true;animateTo({cx:V.cx,cy:V.cy,upp:clampU(V.upp/2**dz)},220)}
function resetView(){userMoved=false;computeHome();animateTo(home,420)}

// ---------- 地图标记（没有地图要素的地点） ----------
const markersEl=document.getElementById("markers");
let markerEls=[];
function drawMarkers(list){
  markersEl.replaceChildren();markerEls=[];
  for(const it of list){
    if(it.refs.length)continue;
    const b=document.createElement("button");
    const gate=it.place.category==="gate";
    b.type="button";b.className=gate?"marker":"marker dot";b.dataset.pid=it.place.id;b.dataset.variant=it.variant;b.dataset.selected=String(it.place.id===selectedId);
    b.setAttribute("aria-label",it.place.title);b.innerHTML='<span aria-hidden="true"></span>';
    b.addEventListener("click",e=>{if(e.detail===0)selectPlace(it.place.id)});
    const[x,y]=P(it.place.geojson.geometry.coordinates);
    let lb=null;
    if(!gate){lb=document.createElement("span");lb.className="mlabel";lb.textContent=it.place.title;markersEl.appendChild(lb)}
    markersEl.appendChild(b);markerEls.push({b,lb,x,y,id:it.place.id});
  }
  render();
}

// ---------- 悬停与选中（照线上 campus-place-hover / selected 图层） ----------
let selectedId=null,selectedKey=null,selKeyLabel=null,hoverKeys=[];
function paint(group,keys){group.replaceChildren();for(const k of keys){const fe=feat.get(k);if(fe)el("path",{d:fe.d,...NSS,"fill-rule":"evenodd"},group)}}
function selectedKeys(){if(selectedId)return itemById.get(selectedId).refs.map(r=>r.layer+":"+r.fid);return selectedKey?[selectedKey]:[]}
function drawSelection(){const ks=selectedKeys();paint(L.selFill,ks);paint(L.selHalo,ks);paint(L.selLine,ks);selKeyLabel=ks[0]||null;drawHover()}
function drawHover(){const sel=new Set(selectedKeys());const ks=hoverKeys.filter(k=>!sel.has(k));paint(L.hovFill,ks);paint(L.hovLine,ks)}
function pick(x,y){
  const t=document.elementFromPoint(x,y);if(!t)return null;
  const m=t.closest&&t.closest(".marker");if(m)return{pid:m.dataset.pid};
  const k=t.dataset&&t.dataset.key;if(!k||!mapEl.contains(t))return null;
  if(placeByKey.has(k))return{pid:placeByKey.get(k)};
  if(k.startsWith("building:"))return{key:k};
  return null;
}
function setHover(h){
  const ks=!h?[]:h.pid?itemById.get(h.pid).refs.map(r=>r.layer+":"+r.fid):[h.key];
  if(ks.join()===hoverKeys.join())return;hoverKeys=ks;drawHover();
}

// ---------- 指针手势 ----------
mapEl.addEventListener("wheel",e=>{e.preventDefault();const r=mapEl.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(e.deltaY*(e.deltaMode?0.05:0.0016)))},{passive:false});
const ptrs=new Map();let moved=0,lastPinch=null;
mapEl.addEventListener("pointerdown",e=>{
  if(e.button>0)return;cancelFly();
  mapEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){moved=0;lastPinch=null}
});
mapEl.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){if(e.pointerType==="mouse")setHover(pick(e.clientX,e.clientY));return}
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){userMoved=true;mapEl.classList.add("dragging");if(hoverKeys.length)setHover(null)}V.cx-=dx*V.upp;V.cy-=dy*V.upp;render()}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=mapEl.getBoundingClientRect();if(lastPinch)zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,lastPinch/d);lastPinch=d;moved+=10}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const single=ptrs.size===1;ptrs.delete(e.pointerId);if(ptrs.size<2)lastPinch=null;
  if(!ptrs.size)mapEl.classList.remove("dragging");
  if(single&&e.type==="pointerup"&&moved<=5){const h=pick(e.clientX,e.clientY);if(!h)clearSelection();else if(h.pid)selectPlace(h.pid);else selectFeature(h.key)}
  if(e.pointerType==="mouse"&&e.type==="pointerup")setHover(pick(e.clientX,e.clientY));
}
mapEl.addEventListener("pointerup",endPtr);mapEl.addEventListener("pointercancel",endPtr);
mapEl.addEventListener("pointerleave",()=>{if(!ptrs.size)setHover(null)});
mapEl.addEventListener("dblclick",e=>{e.preventDefault();const r=mapEl.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;const wx=V.cx+(px-W/2)*V.upp,wy=V.cy+(py-H/2)*V.upp,u=clampU(V.upp/2);userMoved=true;animateTo({cx:wx-(px-W/2)*u,cy:wy-(py-H/2)*u,upp:u},300)});
document.getElementById("zin").onclick=()=>zoomBy(1);
document.getElementById("zout").onclick=()=>zoomBy(-1);
document.getElementById("reset").onclick=()=>{intent="filter";resetView()};

// ---------- 面板 ----------
const panel=document.getElementById("panel"),qEl=document.getElementById("q"),qClear=document.getElementById("qclear"),toggleEl=document.getElementById("toggle"),chipsEl=document.getElementById("chips"),resultsEl=document.getElementById("results"),noticeEl=document.getElementById("notice");
let query="",category="all",expanded=false,activeIdx=-1,openGroups=new Set(),intent="filter",visible=[];
const unnamed=GEO.features.filter(f=>f.properties.layer==="building"&&!f.properties.name).length;
noticeEl.textContent=`海淀校区地图审阅版（${META.date}）。`+(unnamed?`有 ${unnamed} 栋建筑名称待核，用虚线框标出。`:"");
const usedCats=CATS.filter(c=>ITEMS.some(it=>it.cat===c[1]));
for(const[label,val]of[["全部","all"],...usedCats]){const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=val;b.textContent=label;b.onclick=()=>{intent="filter";category=val;activeIdx=-1;update(true)};chipsEl.appendChild(b)}

function rankQ(it,q){const p=it.place;if(!q||p.title.toLowerCase().includes(q))return 0;if((p.tags||[]).some(t=>t.toLowerCase().includes(q)))return 1;if((p.description||"").toLowerCase().includes(q))return 2;return 3}
function filtered(){
  const q=query.trim().toLowerCase();
  return ITEMS.filter(it=>(category==="all"||it.cat===category)&&(!q||it.search.includes(q)))
    .sort((a,b)=>{const g=GROUPS.indexOf(a.label)-GROUPS.indexOf(b.label);if(q){const r=rankQ(a,q)-rankQ(b,q);if(r)return r}return g||collator.compare(a.place.title,b.place.title)});
}
function setExpanded(v){expanded=v;update(false)}
function update(refit){
  visible=filtered();
  const compact=!DESKTOP.matches&&!!(selectedId||selectedKey);
  const showList=expanded&&!compact;
  panel.classList.toggle("expanded",showList);panel.classList.toggle("compact",compact);
  toggleEl.hidden=compact;
  toggleEl.setAttribute("aria-expanded",String(expanded));
  toggleEl.innerHTML=(expanded?ICON.up:ICON.down)+`<span>${expanded?"收起":"地点"}</span>`;
  toggleEl.setAttribute("aria-label",expanded?"收起地点结果":"展开地点结果");
  chipsEl.hidden=!showList;noticeEl.hidden=compact;
  for(const c of chipsEl.children)c.setAttribute("aria-pressed",String(c.dataset.v===category));
  qClear.hidden=!query;qEl.classList.toggle("has",!!query);
  resultsEl.hidden=!showList;
  if(showList)drawResults();
  drawMarkers(visible);
  syncHash();
  if(refit&&intent==="filter")fitToFilter();
}
function drawResults(){
  resultsEl.replaceChildren();
  if(!visible.length){
    const d=document.createElement("div");d.className="empty";
    d.innerHTML='<h3>没有找到匹配地点。</h3><p>调整搜索词或筛选条件后再试。</p>';
    const b=document.createElement("button");b.type="button";b.className="outline-btn";b.textContent="清除筛选";b.onclick=clearFilters;d.appendChild(b);
    resultsEl.appendChild(d);return;
  }
  const h=document.createElement("h2");h.textContent="地点";resultsEl.appendChild(h);
  const force=!!query.trim()||category!=="all";let n=0;
  for(const label of GROUPS){
    const items=visible.filter(it=>it.label===label);if(!items.length)continue;
    const open=force||openGroups.has(label),shown=open?items:items.slice(0,5);
    const fs=document.createElement("fieldset");fs.className="group";
    const lg=document.createElement("legend");lg.textContent=label;fs.appendChild(lg);
    for(const it of shown){
      const i=n++;const b=document.createElement("button");b.type="button";b.className="item"+(i===activeIdx?" active":"");
      b.setAttribute("aria-pressed",String(it.place.id===selectedId));b.setAttribute("aria-label","选择"+it.place.title);b.dataset.pid=it.place.id;
      const t=document.createElement("span");t.className="t";t.textContent=it.place.title;
      const m=document.createElement("span");m.className="meta m";m.textContent=`${it.place.campus} · ${it.label}`;
      const d=document.createElement("span");d.className="d";d.textContent=it.place.description||"";
      b.append(t,m,d);b.onclick=()=>selectPlace(it.place.id);fs.appendChild(b);
    }
    if(items.length>5&&!force){const mb=document.createElement("button");mb.type="button";mb.className="more";mb.textContent=open?`收起${label}`:`展开${label}`;mb.onclick=()=>{open?openGroups.delete(label):openGroups.add(label);drawResults()};fs.appendChild(mb)}
    resultsEl.appendChild(fs);
  }
}
function flatVisible(){return[...resultsEl.querySelectorAll(".item")].map(b=>b.dataset.pid)}
function clearFilters(){intent="filter";query="";qEl.value="";category="all";clearSelection(true);update(true)}
function fitToFilter(){
  if(category==="all"&&!query.trim()){resetView();return}
  if(!visible.length)return;
  let b=[1e9,1e9,-1e9,-1e9];
  for(const it of visible){const[x,y]=P(it.place.geojson.geometry.coordinates);b=[Math.min(b[0],x),Math.min(b[1],y),Math.max(b[2],x),Math.max(b[3],y)]}
  const pw=Math.max((b[2]-b[0])*.5,47),ph=Math.max((b[3]-b[1])*.5,61);
  userMoved=true;animateTo(fitBox([b[0]-pw,b[1]-ph,b[2]+pw,b[3]+ph],padding(),uppOf(16.8)),420);
}
toggleEl.onclick=()=>setExpanded(!expanded);
qEl.addEventListener("focus",()=>{if(!expanded)setExpanded(true)});
qEl.addEventListener("input",()=>{intent="filter";query=qEl.value;expanded=true;activeIdx=-1;if(selectedId||selectedKey)clearSelection(true);update(true)});
qClear.onclick=()=>{query="";qEl.value="";activeIdx=-1;intent="filter";update(true);qEl.focus()};
qEl.addEventListener("keydown",e=>{
  const ids=flatVisible();
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!expanded){setExpanded(true);return}if(!ids.length)return;const s=e.key==="ArrowDown"?1:-1;activeIdx=((activeIdx>=0?activeIdx:(s>0?-1:0))+s+ids.length)%ids.length;drawResults();resultsEl.querySelectorAll(".item")[activeIdx]?.scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"&&ids.length){e.preventDefault();selectPlace(ids[activeIdx>=0?activeIdx:0]);return}
  if(e.key==="Escape"){if(selectedId||selectedKey){e.preventDefault();clearSelection()}else if(query){e.preventDefault();qClear.click()}}
});

// ---------- 详情 ----------
const detail=document.getElementById("detail");
function closeBtn(cls){const b=document.createElement("button");b.type="button";b.className="iconbtn "+cls;b.setAttribute("aria-label","关闭地点详情");b.innerHTML=cls==="grab"?"<span></span>":ICON.x;b.onclick=()=>clearSelection();return b}
function showDetail(o){
  detail.replaceChildren();detail.setAttribute("aria-label",o.title);
  detail.append(closeBtn("grab"));
  const body=document.createElement("div");body.className="dbody";
  const ic=document.createElement("span");ic.className="dicon";ic.innerHTML=ICON.pin;
  const main=document.createElement("div");main.className="dmain";
  const h=document.createElement("h2");h.textContent=o.title;
  const m=document.createElement("p");m.className="m";m.textContent=o.meta;main.append(h,m);
  if(o.desc){const p=document.createElement("p");p.className="desc";p.textContent=o.desc;main.append(p)}
  if(o.rows.length){const rs=document.createElement("div");rs.className="rows";for(const r of o.rows){const d=document.createElement("div");const k=document.createElement("span");k.className="k";k.textContent=r.label;const v=document.createElement("span");v.className="v";v.textContent=r.value;d.append(k,v);rs.append(d)}main.append(rs)}
  if(o.tags.length){const ts=document.createElement("div");ts.className="tags";for(const t of o.tags){const s=document.createElement("span");s.className="tag";s.textContent=t;ts.append(s)}main.append(ts)}
  body.append(ic,main);detail.append(body,closeBtn("dclose"));
  detail.hidden=false;detail.style.animation="none";void detail.offsetWidth;detail.style.animation="";
  root.classList.add("has-sel");
}
function focusTarget(x,y){userMoved=true;animateTo({cx:x,cy:y,upp:uppOf(17)},reduceMotion.matches?0:700)}
function selectPlace(id){
  const it=itemById.get(id);if(!it)return;
  intent="place";selectedId=id;selectedKey=null;
  drawSelection();
  showDetail({title:it.place.title,meta:`${it.place.campus} · ${it.label}`,desc:it.place.description,rows:it.rows,tags:it.tags});
  update(false);
  const[x,y]=P(it.place.geojson.geometry.coordinates);focusTarget(x,y);
}
function selectFeature(key){
  const pr=feat.get(key).f.properties;
  intent="place";selectedId=null;selectedKey=key;drawSelection();
  showDetail({title:"未命名建筑",meta:`${CAMPUS} · 名称待核`,desc:"这栋楼的名称还没有核对，暂不收入地点列表。",rows:[{label:"地图分类",value:pr.category},{label:"地图要素",value:key}],tags:["待核"]});
  update(false);
}
function clearSelection(silent){
  selectedId=null;selectedKey=null;drawSelection();detail.hidden=true;root.classList.remove("has-sel");
  if(!silent)update(false);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(selectedId||selectedKey)&&document.activeElement!==qEl)clearSelection()});

// ---------- 链接状态（可分享） ----------
function syncHash(){
  const s=new URLSearchParams();if(category!=="all")s.set("category",category);if(query.trim())s.set("q",query.trim());if(selectedId)s.set("place",selectedId);
  const h=s.toString();try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search)}catch(_){}
}
function readHash(){const s=new URLSearchParams(location.hash.slice(1));const c=s.get("category");return{category:usedCats.some(x=>x[1]===c)?c:"all",q:s.get("q")||"",place:s.get("place")}}

// ---------- 启动 ----------
function relayout(){measure();computeHome();if(!userMoved){V={...home};}render()}
new ResizeObserver(relayout).observe(mapEl);
DESKTOP.addEventListener("change",()=>{relayout();update(false)});
measure();computeHome();V={...home};
const init=readHash();category=init.category;query=init.q;qEl.value=query;expanded=!!query||category!=="all";
update(false);
if(init.place&&itemById.has(init.place))selectPlace(init.place);
</script>
</body>
